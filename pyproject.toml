[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "exchange-mcp-server"
version = "0.1.0"
description = "Model Context Protocol server for Microsoft Exchange (EWS): mail, calendar, free/busy and meeting rooms."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "exchange-mcp-server contributors" }]
keywords = ["mcp", "exchange", "ews", "outlook", "calendar", "claude", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "mcp>=1.10,<3",
  "exchangelib>=5.4",
  "pydantic>=2.6",
]

[project.optional-dependencies]
oauth = ["msal>=1.28"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "msal>=1.28"]

[project.scripts]
exchange-mcp-server = "exchange_mcp_server.__main__:main"

[project.urls]
Homepage = "https://github.com/Rirychh/exchange-mcp-server"
Issues = "https://github.com/Rirychh/exchange-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/exchange_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
